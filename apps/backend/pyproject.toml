[project]
name = "zen-backend"
version = "0.1.0"
description = "FastAPI backend for Zen daily wisdom service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "supabase>=2.7.0",
  "google-genai>=0.8.0",
  "google-api-python-client>=2.142.0",
  "google-auth>=2.34.0",
  "google-auth-oauthlib>=1.2.1",
  "jinja2>=3.1.4",
  "python-telegram-bot>=21.4",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "numpy>=2.1.0",
  "scipy>=1.14.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.0",
  "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zen_backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

